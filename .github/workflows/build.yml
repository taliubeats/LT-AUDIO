name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (Universal - Apple Silicon + Intel)"
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test licensing and analysis
        run: |
          ./build/tests/lt_tests_artefacts/Release/lt_tests
          ./build/tests/typebeats_analysis_test_artefacts/Release/typebeats_analysis_test
          ./build/tests/pulsar_test_artefacts/Release/pulsar_test
          ./build/tests/void_test_artefacts/Release/void_test
          ./build/tests/orbit_test_artefacts/Release/orbit_test
          ./build/tests/knock_test_artefacts/Release/knock_test
          ./build/tests/nebula_test_artefacts/Release/nebula_test
          ./build/tests/tune_test_artefacts/Release/tune_test
          ./build/tests/nova_test_artefacts/Release/nova_test
          ./build/tests/quasar_test_artefacts/Release/quasar_test
          ./build/tests/quasar_ui_test_artefacts/Release/quasar_ui_test
          ./build/tests/cosmos_test_artefacts/Release/cosmos_test
          ./build/tests/lyra_test_artefacts/Release/lyra_test
          /System/Library/Frameworks/JavaScriptCore.framework/Versions/A/Helpers/jsc m4l/vacuum/tests/vacuum_test.js
          if command -v ffmpeg >/dev/null; then ./build/tests/warp_test_artefacts/Release/warp_test; else echo "no ffmpeg on the runner: warp_test skipped"; fi

      - name: Package
        run: |
          mkdir -p dist pkg/VST3 pkg/Components
          APP="build/apps/license-studio/LTLicenseStudio_artefacts/Release/LT License Studio.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "dist/LT-License-Studio-mac.zip"
          for d in build/plugins/*/*_artefacts/Release; do
            [ -d "$d/VST3" ] && cp -R "$d"/VST3/*.vst3 pkg/VST3/
            [ -d "$d/AU" ] && cp -R "$d"/AU/*.component pkg/Components/
          done
          for b in pkg/VST3/* pkg/Components/*; do codesign --force --deep --sign - "$b"; done
          cp docs/INSTALL.md pkg/INSTALL.md
          (cd pkg && zip -qry ../dist/LT-AUDIO-Plugins-mac.zip .)
          WARP="build/apps/warp/LTWarp_artefacts/Release/LT WARP.app"
          codesign --force --deep --sign - "$WARP"
          ditto -c -k --keepParent "$WARP" "dist/LT-WARP-mac.zip"
          # Max for Live device: the .amxd, its script and the plain patch, zipped together
          python3 m4l/vacuum/make_device.py
          mkdir -p "m4l-pkg/LT VACUUM"
          cp "m4l/vacuum/LT VACUUM.amxd" "m4l/vacuum/LT VACUUM.maxpat" m4l/vacuum/lt_vacuum.js "m4l-pkg/LT VACUUM/"
          cp docs/LT-VACUUM.md "m4l-pkg/LT VACUUM/README.md"
          (cd m4l-pkg && zip -qry "../dist/LT-VACUUM-MaxForLive.zip" "LT VACUUM")
          ./installers/mac/build_pkgs.sh pkg "$APP" dist 0.1.${{ github.run_number }} "$WARP"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  windows:
    if: false   # Mac only for now; remove this line to build Windows again
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DLT_BUILD_STUDIO=OFF

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test licensing and PULSAR
        run: |
          .\build\tests\lt_tests_artefacts\Release\lt_tests.exe
          .\build\tests\pulsar_test_artefacts\Release\pulsar_test.exe
          .\build\tests\void_test_artefacts\Release\void_test.exe
          .\build\tests\orbit_test_artefacts\Release\orbit_test.exe
          .\build\tests\knock_test_artefacts\Release\knock_test.exe
          .\build\tests\nebula_test_artefacts\Release\nebula_test.exe
          .\build\tests\tune_test_artefacts\Release\tune_test.exe
          .\build\tests\nova_test_artefacts\Release\nova_test.exe
          .\build\tests\quasar_test_artefacts\Release\quasar_test.exe
          .\build\tests\quasar_ui_test_artefacts\Release\quasar_ui_test.exe
          .\build\tests\cosmos_test_artefacts\Release\cosmos_test.exe
          .\build\tests\lyra_test_artefacts\Release\lyra_test.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/VST3, dist | Out-Null
          Get-ChildItem -Path build/plugins -Recurse -Directory -Filter *.vst3 |
            Where-Object { $_.FullName -match 'Release\\VST3\\[^\\]+\.vst3$' } |
            ForEach-Object { Copy-Item $_.FullName -Destination pkg/VST3 -Recurse -Force }
          Copy-Item docs/INSTALL.md pkg/INSTALL.md
          Compress-Archive -Path pkg/* -DestinationPath dist/LT-AUDIO-Plugins-windows.zip -Force
          $warp = Get-ChildItem -Path build/apps/warp -Recurse -Filter "LT WARP.exe" | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if ($warp) { Compress-Archive -Path $warp.FullName -DestinationPath dist/LT-WARP-windows.zip -Force }
          ./installers/windows/build_installers.ps1 -Version "0.1.${{ github.run_number }}"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [mac, windows]
    if: ${{ always() && (needs.mac.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BOTH_OK: ${{ needs.mac.result == 'success' && needs.windows.result == 'success' }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "LT AUDIO - latest build" --notes "Automatic build of the main branch." --prerelease
          gh release upload latest dist/* --clobber
          # remove files from older builds that are no longer produced - only when BOTH platforms built,
          # so a Mac (or Windows) runner outage never deletes the last good installers of that platform
          if [ "$BOTH_OK" = "true" ]; then
            for asset in $(gh release view latest --json assets -q '.assets[].name'); do
              [ -f "dist/$asset" ] || gh release delete-asset latest "$asset" -y
            done
          fi
