name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (Universal - Apple Silicon + Intel)"
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test licensing and analysis
        run: |
          ./build/tests/lt_tests_artefacts/Release/lt_tests
          ./build/tests/typebeats_analysis_test_artefacts/Release/typebeats_analysis_test

      - name: Package
        run: |
          mkdir -p dist pkg/VST3 pkg/Components
          APP="build/apps/license-studio/LTLicenseStudio_artefacts/Release/LT License Studio.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "dist/LT-License-Studio-mac.zip"
          for d in build/plugins/*/*_artefacts/Release; do
            [ -d "$d/VST3" ] && cp -R "$d"/VST3/*.vst3 pkg/VST3/
            [ -d "$d/AU" ] && cp -R "$d"/AU/*.component pkg/Components/
          done
          for b in pkg/VST3/* pkg/Components/*; do codesign --force --deep --sign - "$b"; done
          cp docs/INSTALL.md pkg/INSTALL.md
          (cd pkg && zip -qry ../dist/LT-AUDIO-Plugins-mac.zip .)
          ./installers/mac/build_pkgs.sh pkg "$APP" dist 0.1.${{ github.run_number }}
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DLT_BUILD_STUDIO=OFF

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test licensing
        run: .\build\tests\lt_tests_artefacts\Release\lt_tests.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/VST3, dist | Out-Null
          Get-ChildItem -Path build/plugins -Recurse -Directory -Filter *.vst3 |
            Where-Object { $_.FullName -match 'Release\\VST3\\[^\\]+\.vst3$' } |
            ForEach-Object { Copy-Item $_.FullName -Destination pkg/VST3 -Recurse -Force }
          Copy-Item docs/INSTALL.md pkg/INSTALL.md
          Compress-Archive -Path pkg/* -DestinationPath dist/LT-AUDIO-Plugins-windows.zip -Force
          ./installers/windows/build_installers.ps1 -Version "0.1.${{ github.run_number }}"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [mac, windows]
    if: ${{ always() && (needs.mac.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "LT AUDIO - latest build" --notes "Automatic build of the main branch." --prerelease
          gh release upload latest dist/* --clobber
          # remove files from older builds that are no longer produced
          for asset in $(gh release view latest --json assets -q '.assets[].name'); do
            [ -f "dist/$asset" ] || gh release delete-asset latest "$asset" -y
          done
